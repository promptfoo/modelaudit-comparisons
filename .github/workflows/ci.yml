name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Python syntax
        run: python3 -m py_compile run_comparison_fixed.py test_modelscan_manual.py

      - name: Validate JSON artifacts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("results").glob("*.json")) + sorted(Path("test_models").glob("*.json"))
          if not files:
              raise SystemExit("No JSON files found to validate")

          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"validated {path}")
          PY
